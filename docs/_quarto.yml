project:
  type: book
  output-dir: _site
  resources:
    - progress.js
    - tensor-exercises.js
    - trajectory-splines.js

website:
  site-url: https://learningfromembodiedexperiencelab.github.io/onboarding/

book:
  title: "Onboarding: Python & Robotics"
  subtitle: "A working tutorial for the `robotics` example package"
  sidebar:
    title: '<span class="sidebar-brand-title">Onboarding</span><span class="sidebar-brand-subtitle">Python & Robotics</span>'
  favicon: favicon.svg
  repo-url: https://github.com/LearningFromEmbodiedExperienceLab/onboarding
  repo-subdir: docs
  repo-branch: master
  repo-actions: [edit, issue]
  search: true
  chapters:
    - index.qmd
    - part: "Python Basics"
      chapters:
        - python-basics/environment-management.qmd
        - python-basics/project-structure.qmd
        - python-basics/debugging-repl-notebooks.qmd
        - python-basics/github-version-control.qmd
        - python-basics/making-life-easier.qmd
        - python-basics/useful-patterns.qmd
        - python-basics/things-not-to-do.qmd
    - part: "PyTorch and NumPy"
      chapters:
        - pytorch-numpy/tensor-array-indexing.qmd
        - pytorch-numpy/batch-agnostic-operations.qmd
        - pytorch-numpy/randomness.qmd
        - pytorch-numpy/cuda.qmd
        - pytorch-numpy/bells-and-whistles.qmd
    - part: robotics-basics/robotics-basics.qmd
      chapters:
        - robotics-basics/kinematics-vs-dynamics.qmd
        - robotics-basics/scene-vocabulary.qmd
        - robotics-basics/geometry-and-collision.qmd
        - robotics-basics/rotations-and-frames.qmd
        - robotics-basics/asset-files.qmd
        - robotics-basics/two-simulators.qmd
        - robotics-basics/forward-kinematics.qmd
        - robotics-basics/state-sensors-and-actuators.qmd
        - robotics-basics/the-simulation-loop.qmd
        - robotics-basics/simulation-stability.qmd
        - robotics-basics/case-study-ik-tracking.qmd
    - part: reinforcement-learning/reinforcement-learning.qmd
      chapters:
        - reinforcement-learning/ppo-diagnostics.qmd
    - part: "Advanced"
      chapters:
        - advanced/inter-process-communication.qmd
        - advanced/trajectory-parameterization.qmd
        - advanced/geometric-computing.qmd
        - advanced/advanced-more-topics.qmd
    - references.qmd
    - glossary.qmd
    - environment-variables.qmd

format:
  html:
    theme: cosmo
    css:
      - styles.css
      - progress.css
      - tensor-exercises.css
      - trajectory-splines.css
    toc: true
    code-copy: true
    code-overflow: wrap
    html-math-method: mathjax
    include-after-body:
      - progress.html
      - tensor-exercises.html
      - trajectory-splines.html

execute:
  enabled: false

project:
  type: book
  output-dir: _site
  resources:
    - progress.js
    - tensor-exercises.js

website:
  site-url: https://learningfromembodiedexperiencelab.github.io/onboarding/

book:
  title: "Onboarding: Python & Robotics"
  subtitle: "A working tutorial for the `robotics` example package"
  sidebar:
    title: '<span class="sidebar-brand-title">Onboarding</span><span class="sidebar-brand-subtitle">Python & Robotics</span>'
  favicon: favicon.svg
  repo-url: https://github.com/LearningFromEmbodiedExperienceLab/onboarding
  repo-subdir: docs
  repo-branch: master
  repo-actions: [edit, issue]
  search: true
  chapters:
    - index.qmd
    - part: "Python Basics"
      chapters:
        - environment-management.qmd
        - project-structure.qmd
        - debugging-repl-notebooks.qmd
        - github-version-control.qmd
        - making-life-easier.qmd
        - useful-patterns.qmd
        - things-not-to-do.qmd
    - part: "PyTorch and NumPy"
      chapters:
        - tensor-array-indexing.qmd
        - batch-agnostic-operations.qmd
        - cuda.qmd
        - bells-and-whistles.qmd
    - part: robotics-basics.qmd
      chapters:
        - kinematics-vs-dynamics.qmd
        - scene-vocabulary.qmd
        - geometry-and-collision.qmd
        - rotations-and-frames.qmd
        - asset-files.qmd
        - two-simulators.qmd
        - forward-kinematics.qmd
        - state-sensors-and-actuators.qmd
        - the-simulation-loop.qmd
        - simulation-stability.qmd
        - case-study-ik-tracking.qmd
    - part: "Advanced"
      chapters:
        - inter-process-communication.qmd
        - trajectory-parameterization.qmd
        - advanced-more-topics.qmd
    - references.qmd
    - glossary.qmd
    - environment-variables.qmd

format:
  html:
    theme: cosmo
    css:
      - styles.css
      - progress.css
      - tensor-exercises.css
    toc: true
    code-copy: true
    code-overflow: wrap
    html-math-method: mathjax
    include-after-body:
      - progress.html
      - tensor-exercises.html

execute:
  enabled: false

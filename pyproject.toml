[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robotics"
version = "0.1.0"
description = "Tiny example package for the onboarding tutorial."
requires-python = ">=3.11"
dependencies = ["numpy", "einops"]

[project.optional-dependencies]
mujoco = [
    "mujoco",
    "pillow>=12.3.0",
    "scipy>=1.17.1",
    "trimesh>=5.0.0",
]
sim = [
    "mujoco",
    "motrixsim>=0.10.0",
    "pillow>=12.3.0",
    "scipy>=1.17.1",
    "trimesh>=5.0.0",
]
debug = ["pdbpp"]
notebooks = ["ipython", "ipykernel", "matplotlib"]
torch = ["torch"]
ipc = ["pyzmq"]
geometry = [
    "scipy>=1.17.1",
    "trimesh>=5.0.0",
    "scikit-image>=0.25.0",
    "matplotlib>=3.9.0",
]

[tool.pyright]
stubPath = "typings"
extraPaths = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
